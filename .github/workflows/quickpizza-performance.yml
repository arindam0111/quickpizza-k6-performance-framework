name: QuickPizza Performance Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  performance-test:
    name: QuickPizza Smoke Test
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://quickpizza.grafana.com
      PASSWORD: ${{ secrets.QUICKPIZZA_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run QuickPizza smoke test
        run: |
          k6 run --insecure-skip-tls-verify tests/quickPizzaE2E.js
        env:
          TEST_SCENARIO: smoke_test