```yaml
name: QuickPizza Performance Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  performance-test:
    name: QuickPizza Smoke Test
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://quickpizza.grafana.com
      PASSWORD: ${{ secrets.QUICKPIZZA_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run QuickPizza smoke test
        run: |
          mkdir -p reports/smoke
          k6 run --insecure-skip-tls-verify --out json=reports/smoke/ci-smoke-result.json tests/quickPizzaE2E.js
        env:
          TEST_SCENARIO: smoke_test
        continue-on-error: true

      - name: Verify smoke report
        run: |
          echo "Checking reports directory..."
          ls -la reports
          echo "Checking smoke directory..."
          ls -la reports/smoke
          echo "Checking JSON report..."
          test -f reports/smoke/ci-smoke-result.json

      - name: Analyze smoke test report
        run: |
          node analyzer/analyzeReport.js reports/smoke/ci-smoke-result.json

      - name: Upload k6 smoke report
        uses: actions/upload-artifact@v4
        with:
          name: quickpizza-smoke-report
          path: reports/smoke/ci-smoke-result.json
```
